    <style>
.site-blocks-cover{
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center top;
    height:55vw;
    min-height:350px;
    max-height:700px;
}
.site-blocks-cover{
    margin-top: 110px;   /* adjust between 90–120px */
}
@media(max-width:768px){
    .site-blocks-cover{
        background-size:100% auto;
        background-position:center top;
        min-height:250px;
    }
}

		.site-logo img{
    height:140px;
    width:auto;
    display:block;
}

.site-navbar{
    padding-top:10px;
    padding-bottom:10px;
}
	
@media (max-width: 768px) {
    .site-logo img {
        height: 75px;
    }
}
</style>

	<body>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:'Quicksand', sans-serif;
    background:#081420;
}

.hero{
    width:100%;
    min-height:100vh;
    background:url("images/home_page.png") center center no-repeat;
    background-size:cover;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.logo{
    margin-top:20px;
}

.logo img{
    height:90px;
    width:auto;
}

.overlay{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.25);
}

.content{
    text-align:center;
    color:#fff;
    padding:20px;
}

.content h1{
    font-size:60px;
    font-weight:700;
    margin-bottom:20px;
}

.content p{
    font-size:24px;
    margin:0;
    color:#f5f5f5;
}

@media(max-width:768px){

.logo img{
    height:65px;
}

.content h1{
    font-size:36px;
}

.content p{
    font-size:18px;
}

}
</style>

<div class="hero">

    <div class="logo">
        <img src="images/logo.png" alt="Bibek AI">
    </div>

    <div class="overlay">
        <div class="content">
            <h1>🚧 Website Under Construction 🚧</h1>
            <p>We're building something exciting.</p>
            <p><strong>Bibek AI – AI with Wisdom</strong> will be launching soon.</p>
        </div>
    </div>

</div>
